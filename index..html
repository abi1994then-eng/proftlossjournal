<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Advanced Trading Journal & PnL Tracker</title>
  <style>
    :root {
      --bg-color: #0b0f19;
      --card-bg: #151c2c;
      --border-color: #2a3447;
      --text-main: #f1f5f9;
      --text-muted: #94a3b8;
      --profit-color: #22c55e;
      --profit-bg: rgba(34, 197, 94, 0.15);
      --loss-color: #ef4444;
      --loss-bg: rgba(239, 68, 68, 0.15);
      --accent-blue: #3b82f6;
      --accent-hover: #2563eb;
    }

    * { box-sizing: border-box; margin: 0; padding: 0; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; }
    body { background-color: var(--bg-color); color: var(--text-main); padding: 12px; display: flex; justify-content: center; }
    .container { width: 100%; max-width: 1050px; display: flex; flex-direction: column; gap: 16px; }
    header { display: flex; justify-content: space-between; align-items: center; flex-wrap: wrap; gap: 10px; padding: 10px 0; border-bottom: 1px solid var(--border-color); }
    header h1 { font-size: 1.4rem; font-weight: 700; }
    
    .summary-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(140px, 1fr)); gap: 10px; }
    .card { background-color: var(--card-bg); border: 1px solid var(--border-color); border-radius: 8px; padding: 12px; }
    .card h3 { font-size: 0.75rem; color: var(--text-muted); margin-bottom: 4px; text-transform: uppercase; }
    .card .value { font-size: 1.3rem; font-weight: bold; }
    
    .section-box { background-color: var(--card-bg); border: 1px solid var(--border-color); border-radius: 8px; padding: 16px; }
    .section-title { font-size: 1.1rem; margin-bottom: 12px; display: flex; justify-content: space-between; align-items: center; flex-wrap: wrap; gap: 10px;}
    
    .form-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(140px, 1fr)); gap: 10px; }
    .form-group { display: flex; flex-direction: column; gap: 4px; }
    .form-group.full-width { grid-column: 1 / -1; }
    .form-group label { font-size: 0.75rem; color: var(--text-muted); }
    input, select { background-color: var(--bg-color); border: 1px solid var(--border-color); color: var(--text-main); padding: 8px 10px; border-radius: 6px; font-size: 0.85rem; outline: none; }
    input:focus, select:focus { border-color: var(--accent-blue); }
    
    .btn { background-color: var(--accent-blue); color: white; border: none; padding: 8px 14px; border-radius: 6px; font-weight: 600; cursor: pointer; font-size: 0.85rem; transition: background 0.2s; }
    .btn:hover { background-color: var(--accent-hover); }
    .btn-secondary { background-color: transparent; border: 1px solid var(--border-color); color: var(--text-main); }
    .btn-secondary.active { background-color: var(--accent-blue); border-color: var(--accent-blue); color: white; }

    /* Box Mode Styling */
    .box-view-container {
      display: none; /* Hidden by default */
      flex-wrap: wrap;
      gap: 10px;
      justify-content: center;
      align-items: center;
      padding: 10px 0;
    }
    .trade-box {
      border-radius: 8px;
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      color: white;
      font-weight: bold;
      text-align: center;
      box-shadow: 0 4px 6px rgba(0,0,0,0.3);
      position: relative;
      transition: transform 0.2s;
    }
    .trade-box:active { transform: scale(0.95); }
    .trade-box .asset { font-size: 0.75rem; opacity: 0.9; margin-bottom: 2px;}
    .trade-box .amount { font-size: 1.1rem; }
    .trade-box.box-profit { background: linear-gradient(135deg, #22c55e, #16a34a); border: 2px solid #4ade80; }
    .trade-box.box-loss { background: linear-gradient(135deg, #ef4444, #dc2626); border: 2px solid #f87171; }
    .trade-box.box-be { background: linear-gradient(135deg, #64748b, #475569); border: 2px solid #94a3b8; }
    .trade-box .box-del { position: absolute; top: 4px; right: 6px; font-size: 0.7rem; background: rgba(0,0,0,0.2); border: none; color: white; border-radius: 50%; width: 20px; height: 20px; cursor: pointer; }

    /* Table Styling */
    .table-container { overflow-x: auto; }
    table { width: 100%; border-collapse: collapse; text-align: left; font-size: 0.85rem; }
    th, td { padding: 10px; border-bottom: 1px solid var(--border-color); white-space: nowrap; }
    th { background-color: rgba(0, 0, 0, 0.3); color: var(--text-muted); font-size: 0.75rem; text-transform: uppercase; }
    .badge { padding: 3px 6px; border-radius: 4px; font-size: 0.75rem; font-weight: bold; display: inline-block; }
    .profit { color: var(--profit-color); background-color: var(--profit-bg); }
    .loss { color: var(--loss-color); background-color: var(--loss-bg); }
    .delete-btn { background: none; border: none; color: var(--loss-color); cursor: pointer; font-weight: bold; padding: 2px 6px; }
  </style>
</head>
<body>

<div class="container">
  <header>
    <h1>Trading Journal Pro</h1>
  </header>

  <div class="summary-grid">
    <div class="card">
      <h3>Net PnL ($)</h3>
      <div id="total-pnl" class="value">$0.00</div>
    </div>
    <div class="card">
      <h3>Win Rate</h3>
      <div id="win-rate" class="value">0%</div>
    </div>
    <div class="card">
      <h3>Total Trades</h3>
      <div id="total-trades" class="value">0</div>
    </div>
  </div>

  <div class="section-box">
    <div class="section-title">Log Trade Entry</div>
    <form id="trade-form">
      <div class="form-grid">
        <div class="form-group"><label>Date</label><input type="date" id="date" required></div>
        <div class="form-group"><label>Asset</label><input type="text" id="asset" placeholder="e.g. BTC, XAUUSD" required></div>
        <div class="form-group"><label>Outcome</label>
          <select id="outcome">
            <option value="Profit">Profit</option>
            <option value="Loss">Loss</option>
            <option value="BreakEven">Break Even</option>
          </select>
        </div>
        <div class="form-group"><label>PnL Amount ($)</label><input type="number" step="any" id="pnl-amount" placeholder="e.g. 150 or -50" required></div>
      </div>
      <button type="submit" class="btn" style="width: 100%; margin-top: 12px;">+ Add Trade</button>
    </form>
  </div>

  <div class="section-box">
    <div class="section-title">
      <span>Trade History</span>
      <div style="display: flex; gap: 8px;">
        <button id="btn-list" class="btn btn-secondary active" onclick="setView('list')">List Mode</button>
        <button id="btn-box" class="btn btn-secondary" onclick="setView('box')">Box Mode</button>
      </div>
    </div>

    <!-- LIST MODE -->
    <div class="table-container" id="view-list">
      <table>
        <thead>
          <tr><th>Date</th><th>Asset</th><th>Outcome</th><th>PnL ($)</th><th>Action</th></tr>
        </thead>
        <tbody id="trade-list"></tbody>
      </table>
    </div>

    <!-- BOX MODE -->
    <div class="box-view-container" id="view-box">
      <!-- Dynamic boxes inject here -->
    </div>

  </div>
</div>

<script>
  // @ts-nocheck
  let trades = JSON.parse(localStorage.getItem('journal_trades_pro')) || [];
  document.getElementById('date').valueAsDate = new Date();

  function saveAndRefresh() {
    localStorage.setItem('journal_trades_pro', JSON.stringify(trades));
    renderSummary();
    renderViews();
  }

  document.getElementById('trade-form').addEventListener('submit', function(e) {
    e.preventDefault();
    const trade = {
      id: Date.now(),
      date: document.getElementById('date').value,
      asset: document.getElementById('asset').value.toUpperCase(),
      outcome: document.getElementById('outcome').value,
      pnl: parseFloat(document.getElementById('pnl-amount').value)
    };
    trades.unshift(trade);
    saveAndRefresh();
    this.reset();
    document.getElementById('date').valueAsDate = new Date();
  });

  function deleteTrade(id) {
    trades = trades.filter(t => t.id !== id);
    saveAndRefresh();
  }
  window.deleteTrade = deleteTrade;

  function setView(mode) {
    document.getElementById('btn-list').classList.toggle('active', mode === 'list');
    document.getElementById('btn-box').classList.toggle('active', mode === 'box');
    document.getElementById('view-list').style.display = mode === 'list' ? 'block' : 'none';
    document.getElementById('view-box').style.display = mode === 'box' ? 'flex' : 'none';
  }
  window.setView = setView;

  function renderSummary() {
    let netPnL = 0; let wins = 0;
    trades.forEach(t => {
      netPnL += t.pnl;
      if (t.outcome === 'Profit' || t.pnl > 0) wins++;
    });
    const total = trades.length;
    const winRate = total > 0 ? ((wins / total) * 100).toFixed(1) : 0;

    const pnlEl = document.getElementById('total-pnl');
    pnlEl.textContent = `${netPnL >= 0 ? '+' : ''}$${netPnL.toFixed(2)}`;
    pnlEl.className = `value ${netPnL >= 0 ? 'profit' : 'loss'}`;
    document.getElementById('win-rate').textContent = `${winRate}%`;
    document.getElementById('total-trades').textContent = total;
  }

  function renderViews() {
    const listBody = document.getElementById('trade-list');
    const boxContainer = document.getElementById('view-box');
    listBody.innerHTML = '';
    boxContainer.innerHTML = '';

    const maxPnl = trades.length > 0 ? Math.max(...trades.map(t => Math.abs(t.pnl))) : 1;
    const minBoxSize = 75;
    const maxBoxSize = 150;

    trades.forEach(t => {
      const isProfit = t.pnl > 0 || t.outcome === 'Profit';
      const isLoss = t.pnl < 0 || t.outcome === 'Loss';
      const badgeClass = isProfit ? 'profit' : (isLoss ? 'loss' : '');
      const sign = t.pnl >= 0 ? '+' : '';

      const row = document.createElement('tr');
      row.innerHTML = `
        <td>${t.date}</td>
        <td><strong>${t.asset}</strong></td>
        <td><span class="badge ${badgeClass}">${t.outcome}</span></td>
        <td><span class="badge ${badgeClass}">${sign}$${t.pnl.toFixed(2)}</span></td>
        <td><button class="delete-btn" onclick="deleteTrade(${t.id})">✕ Delete</button></td>
      `;
      listBody.appendChild(row);

      let scaleRatio = Math.abs(t.pnl) / maxPnl;
      if (isNaN(scaleRatio) || maxPnl === 0) scaleRatio = 0.5;
      const boxSize = minBoxSize + (scaleRatio * (maxBoxSize - minBoxSize));
      
      let boxClass = 'box-be';
      if (isProfit) boxClass = 'box-profit';
      if (isLoss) boxClass = 'box-loss';

      const box = document.createElement('div');
      box.className = `trade-box ${boxClass}`;
      box.style.width = `${boxSize}px`;
      box.style.height = `${boxSize}px`;
      
      const fontScale = boxSize < 90 ? '0.9rem' : '1.2rem';

      box.innerHTML = `
        <button class="box-del" onclick="deleteTrade(${t.id})">✕</button>
        <div class="asset">${t.asset}</div>
        <div class="amount" style="font-size: ${fontScale}">${sign}$${Math.abs(t.pnl).toFixed(0)}</div>
      `;
      boxContainer.appendChild(box);
    });
  }

  saveAndRefresh();
  setView('list');
</script>
</body>
</html>
